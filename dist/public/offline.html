<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMIX — Hors ligne</title>
  <meta name="theme-color" content="#5B21B6" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #09090B;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 360px;
      width: 100%;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      background: linear-gradient(135deg, #5B21B6, #2E0D7A);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 44px; height: 44px; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      font-size: 0.95rem;
      color: #71717A;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      color: #A1A1AA;
      margin-bottom: 2rem;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #EF4444;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    button {
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, #7C3AED, #5B21B6);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { opacity: 0.8; }
    .hint { margin-top: 1rem; font-size: 0.8rem; color: #52525B; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M28 14C28 9.58 24.42 6 20 6C15.58 6 12 9.58 12 14C12 17.04 13.64 19.68 16 21.16V26C16 26.55 16.45 27 17 27H23C23.55 27 24 26.55 24 26V21.16C26.36 19.68 28 17.04 28 14Z" fill="#BAD7FF"/>
        <path d="M17 28H23V30C23 30.55 22.55 31 22 31H18C17.45 31 17 30.55 17 30V28Z" fill="#7EB8FF"/>
        <path d="M20 12C19.45 12 19 12.45 19 13V16C19 16.55 19.45 17 20 17C20.55 17 21 16.55 21 16V13C21 12.45 20.55 12 20 12Z" fill="#5B21B6"/>
      </svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion Internet et réessayez. SIMIX nécessite une connexion pour fonctionner.</p>
    <div class="badge">
      <span class="dot"></span>
      Aucune connexion détectée
    </div>
    <button onclick="retry()">Réessayer</button>
    <p class="hint">La page se rechargera automatiquement dès que la connexion sera rétablie.</p>
  </div>
  <script>
    function retry() {
      window.location.reload();
    }
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
